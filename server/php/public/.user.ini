; Une trace de sortie complète ou un carnet de sondes de plusieurs années
; dépassent les valeurs par défaut de l'hébergeur. PHP vide alors le corps de
; la requête SANS lever d'erreur : le symptôme est un « bad_request »
; incompréhensible, et jamais un message parlant de taille.
;
; Chez OVH mutualisé, php_value dans .htaccess est ignoré (PHP tourne en
; FastCGI) — c'est ce fichier-ci qui est lu. Il peut mettre quelques minutes à
; être pris en compte : PHP met le résultat en cache.

post_max_size = 12M
upload_max_filesize = 12M
memory_limit = 256M
max_execution_time = 60
