name: Déploiement de l'API (Cloudflare Workers)

# ==========================================================================
# C'est ce fichier qui fait que l'API se pilote par le dépôt et non par un
# panneau : on pousse un commit, GitHub déploie. Aucun identifiant de
# production ne circule ailleurs que dans les secrets du dépôt.
#
# PRÉREQUIS MANUELS — deux fois, une seule fois chacun :
#
#   1. Créer la base :          npx wrangler d1 create grims
#      puis recopier le `database_id` rendu dans server/worker/wrangler.toml.
#
#   2. Déposer les secrets dans Settings → Secrets and variables → Actions :
#
#      Indispensables :
#        CLOUDFLARE_API_TOKEN   jeton d'API, limité aux Workers et à D1
#        CLOUDFLARE_ACCOUNT_ID  visible sur le tableau de bord Cloudflare
#
#      Facultatifs, poussés vers le Worker à chaque déploiement :
#        ADMIN_EMAILS   adresses des administrateurs, séparées par des virgules.
#                       Absent, PERSONNE n'administre — c'est le bon défaut.
#        INVITE_CODE    code d'invitation exigé à l'inscription.
#                       Absent, l'inscription reste ouverte.
#
#      Le jeton se crée sur le tableau de bord Cloudflare, en partant du modèle
#      « Edit Cloudflare Workers » et en y ajoutant « D1 : Edit ». Ne prenez
#      PAS un jeton global : celui-ci ne doit pouvoir toucher qu'à cette API.
#
# Un secret déposé ici n'est visible de personne — ni dans les journaux, ni
# dans le dépôt, ni de l'agent qui écrit ce fichier.
# ==========================================================================

on:
  push:
    branches: [main, claude/grims-compagnon-fishing-app-f3qa6n, claude/gps-navigation-mode-4qvlxe]
    # Ne se déclenche que si l'API a bougé. Une correction d'affichage dans
    # l'app n'a aucune raison de redéployer le serveur.
    paths:
      - 'server/worker/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci || npm install

      - name: Syntaxe des modules
        run: |
          fail=0
          for f in src/*.js; do node --check "$f" || fail=1; done
          exit $fail

      # La recette complète, contre le Worker lancé en local avec sa vraie base
      # D1. C'est le seul moment où l'on peut encore attraper une régression
      # sans l'avoir mise en production.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Recette contre le Worker local
        env:
          WRANGLER_SEND_METRICS: 'false'
          CI: '1'
        run: |
          npx wrangler d1 migrations apply grims-dev --env dev --local
          npx wrangler dev --env dev --local --port 8788 --ip 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8788/api/health > /dev/null && break
            sleep 2
          done
          # Le code correspond à celui de [env.dev.vars] : la recette peut donc
          # éprouver la porte d'invitation, et pas seulement constater sa
          # présence dans le code.
          GRIMS_INVITE='marée-basse-2026' php ../php/tests/acceptance.php http://127.0.0.1:8788

          # La recette se TERMINE en épuisant volontairement la limitation de
          # débit — c'est sa dernière vérification. Le test suivant part donc
          # d'une adresse IP déjà bloquée pour une minute, et échouait en
          # `rate_limited` sur des connexions parfaitement valides.
          #
          # On vide le compteur au lieu d'attendre soixante secondes, et au lieu
          # de relever le plafond : cette limite est la seule chose qui rende
          # inutile l'essai systématique des mots de passe, elle ne s'assouplit
          # pas pour arranger un test. C'est une base de développement locale,
          # la vider n'a aucun effet sur la production.
          npx wrangler d1 execute grims-dev --env dev --local --command "DELETE FROM attempts"

          # Administration et suspension. Séparé de la recette de contrat :
          # ces routes n'existent que sur cette implémentation, et les mêler
          # ferait échouer la recette contre la version PHP, qui ne les a pas.
          node tests/admin.mjs http://127.0.0.1:8788 'marée-basse-2026' 'chef@exemple.fr'

          npx wrangler d1 execute grims-dev --env dev --local --command "DELETE FROM attempts"

          # Cobaturage. Le noyau de règles y est éprouvé sans serveur — c'est
          # lui qui décide si une sortie reste un partage de frais ou devient
          # du transport de passagers — puis on vérifie que le serveur refuse
          # ce qu'un client modifié tenterait de forcer.
          node tests/cobaturage.mjs http://127.0.0.1:8788 'marée-basse-2026'

  deploy:
    name: Publication
    needs: verify
    # Contrairement à Pages — qui n'accepte de publier QUE depuis la branche par
    # défaut, contrainte de la plateforme — Cloudflare n'impose rien. La branche
    # de développement peut donc publier, ce qui permet d'éprouver l'API en
    # ligne avant de fusionner. Toute branche non listée ici ne déploie pas.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      || github.ref == 'refs/heads/claude/gps-navigation-mode-4qvlxe'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci || npm install

      # Les migrations AVANT le déploiement : le nouveau code peut avoir besoin
      # d'une colonne que l'ancien schéma n'a pas, jamais l'inverse. Dans
      # l'autre ordre, il existe une fenêtre où le code déployé interroge une
      # table qui n'existe pas encore.
      # `--env=""` désigne explicitement l'environnement de tête. Le fichier en
      # définit deux (celui-ci et `dev`, purement local) : sans la mention,
      # wrangler avertit qu'il devine, et deviner sur un déploiement est
      # exactement ce qu'on ne veut pas.
      - name: Migrations D1
        run: npx wrangler d1 migrations apply grims --remote --env=""

      - name: Déploiement du Worker
        run: npx wrangler deploy --env=""

      # Les secrets d'exploitation, poussés depuis ceux du dépôt.
      #
      # ADMIN_EMAILS et INVITE_CODE ne peuvent pas vivre dans wrangler.toml :
      # le dépôt est public, les y écrire publierait l'adresse de qui
      # administre le service et le code qui en ouvre l'accès.
      #
      # Ils passaient donc par `wrangler secret put` à la main — ce qui suppose
      # un terminal, Node et une session Cloudflare. C'est une marche trop
      # haute pour un réglage qu'on fait une fois : le secret restait absent,
      # et l'entrée d'administration n'apparaissait jamais. Déposer le secret
      # dans GitHub se fait depuis un navigateur, téléphone compris.
      #
      # Un secret vide ou absent ne pousse RIEN : sans ce garde-fou, un dépôt
      # qui ne les définit pas les écraserait par du vide à chaque livraison —
      # et couperait l'administration à la première publication venue.
      #
      # La valeur ne transite que par l'entrée standard : elle n'apparaît ni
      # dans la ligne de commande, ni dans les journaux, ni dans `ps`.
      - name: Secrets d'exploitation
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
        run: |
          if [ -n "$ADMIN_EMAILS" ]; then
            printf '%s' "$ADMIN_EMAILS" | npx wrangler secret put ADMIN_EMAILS --env=""
            echo "ADMIN_EMAILS : posé"
          else
            echo "ADMIN_EMAILS : non défini dans le dépôt — inchangé sur le Worker"
          fi
          if [ -n "$INVITE_CODE" ]; then
            printf '%s' "$INVITE_CODE" | npx wrangler secret put INVITE_CODE --env=""
            echo "INVITE_CODE : posé"
          else
            echo "INVITE_CODE : non défini dans le dépôt — inchangé sur le Worker"
          fi

      # Le secret est-il ARRIVÉ ?
      #
      # « wrangler secret put a rendu 0 » ne prouve pas que le Worker en tienne
      # compte : il reste le redémarrage, la bonne cible d'environnement, et le
      # code qui lit la variable. C'est le genre d'écart qui ne se voit qu'en
      # interrogeant le service lui-même — et qui, ici, laisse l'administration
      # inaccessible sans qu'aucune étape ne rougisse.
      #
      # On compare donc ce qu'on a poussé à ce que le Worker déclare. Un écart
      # fait ÉCHOUER la livraison : une administration qu'on croit active et
      # qui ne l'est pas est pire qu'une panne visible.
      #
      # `/api/health` ne rend que des booléens, jamais les adresses : la page
      # est publique et doit le rester.
      - name: Le Worker connaît-il ses secrets ?
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
          API_URL: ${{ vars.API_URL || 'https://grims-api.qentina-louviers.workers.dev' }}
        run: |
          sante=$(curl -sS --max-time 20 "$API_URL/api/health")
          echo "$sante"
          lu() { printf '%s' "$1" | node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              try { console.log(JSON.parse(s)[process.argv[1]] === true ? 'oui' : 'non') }
              catch { console.log('illisible') }
            })" "$2"; }

          admin=$(lu "$sante" adminConfigured)
          invit=$(lu "$sante" invitesOnly)
          echo "administration active : $admin"
          echo "inscription sur invitation : $invit"

          if [ -n "$ADMIN_EMAILS" ] && [ "$admin" != "oui" ]; then
            echo "::error::ADMIN_EMAILS est défini dans le dépôt mais le Worker ne le voit pas — le panneau d'administration resterait inaccessible."
            exit 1
          fi
          if [ -z "$ADMIN_EMAILS" ] && [ "$admin" = "oui" ]; then
            echo "::warning::Le Worker garde un ADMIN_EMAILS qui ne vient pas de ce dépôt (posé à la main ?)."
          fi
          if [ -n "$INVITE_CODE" ] && [ "$invit" != "oui" ]; then
            echo "::error::INVITE_CODE est défini dans le dépôt mais l'inscription reste ouverte."
            exit 1
          fi

      # La recette COMPLÈTE contre la production, pas une simple sonde.
      #
      # Un `/api/health` vert ne prouve presque rien : le CORS et le passage de
      # l'en-tête `Authorization` sont précisément ce qui fonctionne partout
      # ailleurs et casse une fois en ligne. Ils ne se voient qu'en faisant le
      # vrai parcours, depuis une machine qui n'est pas celle du développement.
      #
      # La recette ne touche à aucune donnée existante : elle crée un compte à
      # l'adresse aléatoire, s'en sert, puis le supprime. Elle laisse seulement
      # l'adresse IP du runner en limitation de débit une minute, ce qui ne
      # concerne personne d'autre.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Recette contre la production
        env:
          # Pas un secret : l'adresse publique du Worker. La variable de dépôt
          # la remplace si le nom change un jour.
          API_URL: ${{ vars.API_URL || 'https://grims-api.qentina-louviers.workers.dev' }}
        run: |
          echo "Cible : $API_URL"
          php ../php/tests/acceptance.php "$API_URL"
