  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- houle -->
  <path d="M40 372 q54 -34 108 0 t108 0 t108 0 t108 0" fill="none" stroke="#164e63" stroke-width="14" stroke-linecap="round"/>
  <path d="M40 416 q54 -34 108 0 t108 0 t108 0 t108 0" fill="none" stroke="#0e3a4a" stroke-width="14" stroke-linecap="round"/>

  <!-- rose des vents -->
  <circle cx="256" cy="218" r="132" fill="none" stroke="#1c2f47" stroke-width="10"/>
  <circle cx="256" cy="218" r="132" fill="none" stroke="#22d3ee" stroke-width="10"
