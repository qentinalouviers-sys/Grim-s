  <g stroke="#3c5a7d" stroke-width="7" stroke-linecap="round">
    <line x1="256" y1="104" x2="256" y2="128"/>
    <line x1="256" y1="308" x2="256" y2="332"/>
    <line x1="142" y1="218" x2="166" y2="218"/>
    <line x1="346" y1="218" x2="370" y2="218"/>
  </g>

  <!-- aiguille -->
  <path d="M256 106 L294 250 L256 226 L218 250 Z" fill="url(#needle)"/>
